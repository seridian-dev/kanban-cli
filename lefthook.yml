# Local quality gates (no GitHub Actions). Installed by `bun install` (prepare script).
# pre-commit is fast (lint on staged files only); pre-push runs the full gate.
pre-commit:
  commands: {}

pre-push:
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test
    build:
      run: bun run build
