name: Publish to npm

# Push a tag like v0.2.0 whose version matches package.json, or run manually for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm 11.5.1+, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Skip if this version is already on npm
        id: check
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published."
          fi
      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: npm publish --provenance --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
